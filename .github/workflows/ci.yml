name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs. Dispatch goes through the API and is unaffected by webhook
  # delivery incidents; re-running CI no longer needs an empty commit.
  workflow_dispatch:

# Least privilege: the build/test job only needs to read the repo.
permissions:
  contents: read

# Cancel an in-progress run when a *PR branch* is pushed again — but never cancel a
# push to main, or that commit is left with a permanently "cancelled" status (masking
# breakage and putting holes in CI-status bisection).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: Toolchord.xcodeproj
  SCHEME: Toolchord

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/tests/*.sh
      - name: Build and release stub regression tests
        run: |
          bash scripts/tests/build.sh
          bash scripts/tests/release.sh

  build-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30   # a wedged xcodebuild shouldn't burn 6h of 10x-billed runner time
    steps:
      # Actions are pinned to immutable commit SHAs: a mutable tag can be repointed
      # at tampered code after the fact, a commit SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here runs git after checkout

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'   # pin the stable toolchain shipped on macos-26

      - name: Install tooling
        run: brew install xcbeautify xcodegen

      # Tests live in the SwiftPM package (Tests/), not in the generated project —
      # `make test` is `swift test`.
      - name: Test (SwiftPM)
        run: swift test

      # The .xcodeproj is generated and gitignored; CI must produce it the same
      # way make project / scripts/build.sh do.
      - name: Build the app (xcodegen + Release)
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify

      - name: Sign and verify App Sandbox restrictions
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Toolchord.app"
          codesign --force --deep --sign - --entitlements App/Toolchord.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/signed-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' \
            "$RUNNER_TEMP/signed-entitlements.plist" | grep -qx true

      # Third-Party-Notices.txt becomes mandatory in the built app as soon as the
      # repo commits one; until the app bundles third-party content there is
      # nothing to assert.
      - name: Check notices in the built app
        run: |
          NOTICES="App/Resources/Third-Party-Notices.txt"
          [ -f "$NOTICES" ] || { echo "::notice::no Third-Party-Notices.txt committed yet — skip"; exit 0; }
          BUILT="$RUNNER_TEMP/DerivedData/Build/Products/Release/Toolchord.app/Contents/Resources/Third-Party-Notices.txt"
          test -s "$BUILT" || { echo "::error::$NOTICES is committed but missing from the built app"; exit 1; }
