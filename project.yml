# Generates Toolchord.xcodeproj: run `xcodegen generate` (or `make project`).
name: Toolchord
options:
  bundleIdPrefix: ch.lkmc
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ToolchordPackage:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Toolchord:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Toolchord.entitlements"
          - "Info.plist"
    # Xcode copies changed SwiftPM resources without invalidating the outer app
    # signature. This declared resource output makes script-only edits re-sign it.
    preBuildScripts:
      - name: Track bundled tools for signing
        inputFiles:
          - "$(SRCROOT)/Sources/ToolchordCore/Scripts"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ToolScripts.sha256"
        script: |
          set -eu
          cd "$SCRIPT_INPUT_FILE_0"
          LC_ALL=C /usr/bin/shasum -a 256 */*.js > "$SCRIPT_OUTPUT_FILE_0"
    dependencies:
      - target: AuthoringProvider
        embed: true
      - package: ToolchordPackage
        product: ToolchordMac
    settings:
      base:
        PRODUCT_NAME: Toolchord
        PRODUCT_BUNDLE_IDENTIFIER: ch.lkmc.Toolchord
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Toolchord
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Public domain (The Unlicense)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        USE_RECURSIVE_SCRIPT_INPUTS_IN_SCRIPT_PHASES: YES
        ENABLE_ADDITIONAL_CODESIGN_INPUT_TRACKING_FOR_SCRIPT_OUTPUTS: YES
        CODE_SIGN_ENTITLEMENTS: App/Toolchord.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        DEAD_CODE_STRIPPING: YES
  AuthoringProvider:
    type: xpc-service
    platform: macOS
    sources:
      - path: ProviderService
        excludes: [Info.plist]
    dependencies:
      - package: ToolchordPackage
        product: ToolchordProviderHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.lkmc.Toolchord.AuthoringProvider
        INFOPLIST_FILE: ProviderService/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
