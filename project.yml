# Generates Toolchord.xcodeproj: run `xcodegen generate` (or `make project`).
name: Toolchord
options:
  bundleIdPrefix: ch.lkmc
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ToolchordPackage:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Toolchord:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Toolchord.entitlements"
    dependencies:
      - package: ToolchordPackage
        product: ToolchordMac
    settings:
      base:
        PRODUCT_NAME: Toolchord
        PRODUCT_BUNDLE_IDENTIFIER: ch.lkmc.Toolchord
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Toolchord
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Public domain (The Unlicense)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Toolchord.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        DEAD_CODE_STRIPPING: YES
